    <!-- Favicon Grayscale Effect Script -->
    <script>
      (function() {
        const faviconUrl = '/logo-icon.png';
        const originalFavicon = document.getElementById('favicon');
        
        // Create a canvas to apply grayscale filter
        const applyGrayscaleEffect = () => {
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            
            // Draw the image
            ctx.drawImage(img, 0, 0);
            
            // Apply grayscale filter
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
              const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
              data[i] = gray;     // red
              data[i + 1] = gray; // green
              data[i + 2] = gray; // blue
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Convert to favicon
            const grayscaleFavicon = canvas.toDataURL('image/png');
            originalFavicon.href = grayscaleFavicon;
          };
          img.src = faviconUrl;
        };
        
        // Handle visibility changes
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            // Tab is inactive - show grayscale
            applyGrayscaleEffect();
          } else {
            // Tab is active - show original icon
            originalFavicon.href = faviconUrl;
          }
        });
      })();
    </script>
